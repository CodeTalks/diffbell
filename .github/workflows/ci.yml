# CI: the full gate (make check, with Watchman and node) on macOS for every push to
# main and every pull request. The release workflow calls this same file as its first
# job, so the gate's steps live in one place.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install Watchman (the integration tests run on a private instance)
        run: brew install watchman

      - name: Install dependencies
        run: uv sync --locked

      - name: Quality gate
        env:
          DIFFBELL_REQUIRE_NODE: "1"
        run: make check
