# Release: pushing a tag vX.Y.Z checks the tag names the version, runs the gate
# (ci.yml, on macOS), builds the sdist and the wheel, checks the sdist holds exactly
# the tracked files, then publishes a GitHub release with both files and SHA256SUMS
# (the Homebrew formula downloads the sdist from it). Nothing goes to PyPI.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: false

      - name: The tag names the version
        run: uv run --no-project python -I scripts/release_check.py version "$GITHUB_REF_NAME"

  gate:
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Build the sdist and the wheel
        run: uv build --out-dir dist

      - name: The sdist holds exactly the tracked files
        run: uv run --no-project python -I scripts/release_check.py sdist dist

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 -- *.tar.gz *.whl > SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl dist/SHA256SUMS
          --verify-tag --generate-notes --title "Diffbell ${GITHUB_REF_NAME#v}"
