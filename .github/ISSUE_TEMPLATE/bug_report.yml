name: Bug report
description: Something Diffbell does wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a bot token or a chat id.** `diffbell doctor` and `diffbell status`
        never print them, so their output is safe to share. For a security problem, use
        [private reporting](https://github.com/CodeTalks/diffbell/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: doctor
    attributes:
      label: Output of `diffbell doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (`diffbell --version`) and how it's installed (Homebrew or a checkout)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
